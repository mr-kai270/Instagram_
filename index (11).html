<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaFetch - Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .card { width: 100%; max-width: 480px; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 0.5rem; color: #f43f5e; }
    p { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 1.5rem; }
    input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 0.75rem; }
    button { width: 100%; padding: 0.75rem; background: #e11d48; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #status { margin-top: 1rem; font-size: 0.85rem; color: #f87171; text-align: center; display: none; }
    #result { margin-top: 1.5rem; display: none; flex-direction: column; gap: 0.75rem; }
    video { width: 100%; border-radius: 6px; background: #000; max-height: 300px; }
    a.dl-btn { display: block; text-align: center; background: #10b981; color: white; padding: 0.75rem; border-radius: 6px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Instagram Reel Downloader</h1>
    <p>Paste the public link to fetch the video source</p>
    <input type="url" id="targetUrl" placeholder="https://www.instagram.com/reel/..." required>
    <button id="submitBtn" onclick="downloadVideo()">Fetch Video</button>
    <div id="status"></div>
    <div id="result">
      <video id="player" controls playsinline></video>
      <a id="saveLink" class="dl-btn" target="_blank" rel="noopener noreferrer">Download .MP4</a>
    </div>
  </div>

  <script>
    async function downloadVideo() {
      const url = document.getElementById('targetUrl').value.trim();
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const btn = document.getElementById('submitBtn');
      const player = document.getElementById('player');
      const saveLink = document.getElementById('saveLink');

      if (!url) return;
      status.style.display = 'none';
      result.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed to extract video.');

        player.src = data.video_url;
        saveLink.href = data.video_url;
        result.style.display = 'flex';
      } catch (err) {
        status.textContent = err.message;
        status.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch Video';
      }
    }
  </script>
</body>
</html>
