<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaFetch - Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      padding: 2.25rem;
      border-radius: 14px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 0.35rem;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.desc {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus {
      border-color: #e1306c;
    }
    button.btn-submit {
      padding: 0.85rem;
      background: linear-gradient(45deg, #dc2743, #bc1888);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #error-box {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
    }
    #output-box {
      margin-top: 1.5rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
    }
    video {
      width: 100%;
      max-height: 360px;
      border-radius: 8px;
      background: #000;
    }
    .url-display-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-copy {
      padding: 0 1rem;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-copy:hover {
      background: #475569;
    }
    .btn-download {
      display: block;
      text-align: center;
      padding: 0.8rem;
      background: #10b981;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
    }
    .btn-download:hover {
      background: #059669;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Instagram Video Downloader</h1>
    <p class="desc">Paste a link to any public Reel or Video</p>

    <form id="fetch-form" onsubmit="handleDownload(event)">
      <div class="form-group">
        <input 
          type="url" 
          id="url-input" 
          placeholder="https://www.instagram.com/reel/..." 
          required 
          autocomplete="off"
        />
        <button type="submit" id="submit-btn" class="btn-submit">Fetch Video</button>
      </div>
    </form>

    <div id="error-box"></div>

    <div id="output-box">
      <video id="video-player" controls playsinline referrerpolicy="no-referrer"></video>
      
      <div>
        <label style="font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Direct Video URL:</label>
        <div class="url-display-group">
          <input type="text" id="direct-url-input" readonly />
          <button type="button" class="btn-copy" id="copy-btn" onclick="copyDirectUrl()">Copy</button>
        </div>
      </div>

      <button id="save-button" class="btn-download" type="button">Save Video (.MP4)</button>
    </div>
  </div>

  <script>
    let currentBlobUrl = null;

    async function handleDownload(e) {
      e.preventDefault();

      const urlInput = document.getElementById('url-input');
      const submitBtn = document.getElementById('submit-btn');
      const errorBox = document.getElementById('error-box');
      const outputBox = document.getElementById('output-box');
      const videoPlayer = document.getElementById('video-player');
      const directUrlInput = document.getElementById('direct-url-input');
      const saveButton = document.getElementById('save-button');

      const url = urlInput.value.trim();
      if (!url) return;

      errorBox.style.display = 'none';
      outputBox.style.display = 'none';
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resolving media...';

      try {
        const response = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to fetch video.');
        }

        const directLink = data.direct_url || '';
        directUrlInput.value = directLink;

        const streamEndpoint = data.proxy_url || directLink;
        submitBtn.textContent = 'Buffering stream...';

        const mediaResponse = await fetch(streamEndpoint);
        if (!mediaResponse.ok) {
          throw new Error('Unable to stream media bytes from provider.');
        }

        const videoBlob = await mediaResponse.blob();
        currentBlobUrl = URL.createObjectURL(videoBlob);

        videoPlayer.src = currentBlobUrl;
        videoPlayer.load();

        saveButton.onclick = () => {
          const a = document.createElement('a');
          a.href = currentBlobUrl;
          a.download = `instagram_video_${Date.now()}.mp4`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };

        outputBox.style.display = 'flex';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Fetch Video';
      }
    }

    function copyDirectUrl() {
      const copyInput = document.getElementById('direct-url-input');
      const copyBtn = document.getElementById('copy-btn');
      
      navigator.clipboard.writeText(copyInput.value).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
        }, 2000);
      });
    }
  </script>
</body>
</html>
